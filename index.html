<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vymera · Explained volatility alerts for young investors</title>
<meta name="description" content="Vymera MVP: explained volatility alerts, look-through exposure and protection rules for young investors.">
<style>
:root{
  --navy:#1E2263; --ink:#151842; --deep:#0B1250; --green:#6CC201; --green-d:#4E9300;
  --light:#D2E8F2; --sky:#EAF4F9; --paper:#F6F9FC; --line:#DDE5EE; --muted:#6B7194;
  --amber:#F2A541; --amber-l:#FDF1DE; --coral:#E4572E; --white:#fff;
  --r:18px; --shadow:0 6px 24px rgba(21,24,66,.08);
  --fs:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:radial-gradient(1200px 700px at 20% 10%,#1b2a8a 0%,var(--deep) 55%,#060a33 100%);
  display:flex;align-items:center;justify-content:center;gap:40px;min-height:100vh;padding:24px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}
.hidden{display:none!important}

/* ---------- phone frame ---------- */
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 2px #2b2f5e;flex-shrink:0;position:relative}
.screen{width:100%;height:100%;background:var(--paper);border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:calc(15px * var(--fs))}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;flex-shrink:0;color:var(--ink)}
.statusbar .notch{width:120px;height:30px;background:#000;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:10px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 110px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}

/* ---------- nav ---------- */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 22px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;width:70px;position:relative}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--navy)}
.tab.active svg{stroke:var(--green)}
.badge{position:absolute;top:-4px;right:14px;background:var(--amber);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- type & cards ---------- */
h1{font-size:1.75em;letter-spacing:-.02em;color:var(--navy);line-height:1.15}
h2{font-size:1.15em;color:var(--navy);letter-spacing:-.01em}
h3{font-size:1em;color:var(--navy)}
.eyebrow{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85em}
.xs{font-size:.75em}
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.75em;font-weight:700}
.pill.green{background:#EAF7D6;color:var(--green-d)}
.pill.amber{background:var(--amber-l);color:#A8620B}
.pill.navy{background:var(--light);color:var(--navy)}
.pill.coral{background:#FCE3DB;color:#B23A18}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1em;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--sky);color:var(--navy)}
.btn.line{border:1.5px solid var(--line);color:var(--navy);background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--navy);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.divider{height:1px;background:var(--line);margin:12px 0}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--navy);font-weight:700;margin:6px 0 10px}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,var(--navy),#2a3190);color:#fff;border-radius:22px;padding:18px;margin-top:10px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(108,194,1,.35),transparent 70%)}
.hero .val{font-size:2.1em;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.hero .chg{font-weight:700;font-size:.9em;opacity:.95}
.weather{display:flex;gap:14px;align-items:center}
.wicon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wicon.calm{background:#EAF7D6}.wicon.choppy{background:var(--amber-l)}.wicon.stormy{background:#E4E6F5}
.meter{height:8px;border-radius:8px;background:linear-gradient(90deg,#B9E57A 0%,#B9E57A 30%,#F7CF8F 30%,#F7CF8F 60%,#9097C9 60%,#9097C9 100%);position:relative;margin:14px 0 4px}
.meter .knob{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--navy);transform:translateX(-50%);transition:left .35s}
.bar{height:10px;background:var(--sky);border-radius:10px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--navy);transition:width .4s}
.bar .limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--coral)}
.expo{margin-top:12px}
.expo .lbl{display:flex;justify-content:space-between;font-size:.85em;margin-bottom:5px}
.holding{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.holding:last-child{border-bottom:none}
.logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75em;color:#fff;flex-shrink:0}
.spark{width:100%;height:46px;display:block;margin-top:8px}

/* ---------- alerts ---------- */
.alert-item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:#fff;box-shadow:var(--shadow);margin-top:10px;text-align:left;width:100%}
.alert-item .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);margin-top:6px;flex-shrink:0}
.alert-item.read .dot{background:var(--line)}
.wf{margin-top:10px}
.wf-row{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:8px;margin:9px 0;font-size:.85em}
.wf-track{height:22px;position:relative;background:var(--paper);border-radius:6px}
.wf-track i{position:absolute;right:50%;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--navy)}
.wf-track i.pos{left:50%;right:auto;border-radius:0 6px 6px 0;background:var(--green)}
.wf-track:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.wf-row b{text-align:right}
.option{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;text-align:left;width:100%;background:#fff;display:block}
.option.rec{border-color:var(--green);background:#F6FCEE}
.option.sel{outline:3px solid rgba(108,194,1,.35)}
.option .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--navy)}
.quote{background:var(--sky);border-radius:14px;padding:12px 14px;font-size:.88em;color:var(--navy);margin-top:10px}
.sources{font-size:.75em;color:var(--muted);margin-top:10px;line-height:1.5}

/* ---------- rules ---------- */
.rule{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-top:10px}
.switch{width:46px;height:28px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on:after{left:21px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78em;background:var(--paper);border-radius:10px;padding:10px;color:var(--navy);margin-top:10px;line-height:1.55}
.field{margin-top:12px}
.field label{display:block;font-size:.78em;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field select,.field input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.85em;color:var(--navy);background:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- learn ---------- */
.lesson{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-top:10px;width:100%;text-align:left}
.lesson .em{width:44px;height:44px;border-radius:12px;background:var(--light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--green)}

/* ---------- onboarding ---------- */
.ob{display:flex;flex-direction:column;min-height:100%;padding-bottom:20px}
.ob .grow{flex:1}
.choice{display:block;width:100%;text-align:left;padding:15px;border-radius:16px;border:1.5px solid var(--line);background:#fff;margin-top:10px;font-weight:700;color:var(--navy)}
.choice.on{border-color:var(--green);background:#F6FCEE}
.choice span{display:block;font-weight:500;color:var(--muted);font-size:.85em;margin-top:2px}
.steps{display:flex;gap:6px;margin:8px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--green)}
.broker{display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;border:1.5px solid var(--line);background:#fff;margin-top:10px;width:100%;text-align:left}
.broker.on{border-color:var(--green);background:#F6FCEE}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);margin-left:auto;display:flex;align-items:center;justify-content:center}
.broker.on .check{background:var(--green);border-color:var(--green)}

/* ---------- sheet & toast ---------- */
.sheet-bg{position:absolute;inset:0;background:rgba(11,18,80,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 34px;width:100%;max-height:88%;overflow-y:auto;animation:up .25s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:14px;right:14px;top:52px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;z-index:40;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:drop .3s ease-out;cursor:pointer}
.toast .ic{width:34px;height:34px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.countdown{font-size:2.6em;font-weight:800;color:var(--navy);text-align:center;margin:10px 0}

/* ---------- presenter panel ---------- */
.panel{width:330px;color:#fff;flex-shrink:0}
.panel .brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.panel .tag{opacity:.75;margin-top:6px;font-size:14px;line-height:1.45}
.panel h4{margin:26px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.scn{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;margin-top:8px;color:#fff;transition:.15s}
.scn:hover{background:rgba(255,255,255,.13)}
.scn b{display:block;font-size:14px}
.scn span{display:block;font-size:12px;opacity:.7;margin-top:2px}
.scn.active{border-color:var(--green);background:rgba(108,194,1,.15)}
.mini{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:8px;font-family:ui-monospace,Menlo,monospace}
.mini b{color:var(--green)}
.panel-toggle{display:none}

@media (max-width:820px){
  body{padding:0;display:block;background:var(--paper)}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .statusbar .notch{display:none}
  .panel{position:fixed;inset:auto 0 0 0;width:100%;background:var(--deep);padding:18px;z-index:100;max-height:70vh;overflow:auto;transform:translateY(100%);transition:.25s}
  .panel.open{transform:none}
  .panel-toggle{display:block;position:fixed;right:12px;top:50px;z-index:101;background:var(--deep);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:700;opacity:.85}
}
</style>
</head>

/* ==========================================================
   ML: logistic regression, same features as the Python model
   ========================================================== */
function featuresAt(close, high, low, i){
  const c = close[i];
  const pct = (k)=> close[i]/close[i-k]-1;
  const mean = (k)=>{ let s=0; for(let j=i-k+1;j<=i;j++) s+=close[j]; return s/k; };
  // volatility of volatility: std of daily log changes over 20 days (sample std, like pandas)
  const lr=[]; for(let j=i-19;j<=i;j++) lr.push(Math.log(close[j]/close[j-1]));
  const m = lr.reduce((a,b)=>a+b,0)/lr.length;
  const vv = Math.sqrt(lr.reduce((a,b)=>a+(b-m)**2,0)/(lr.length-1));
  // percentile rank in last 252 days
  let cnt=0; for(let j=i-251;j<=i;j++) if(close[j]<=c) cnt++;
  return {vix:c, log_vix:Math.log(c), chg_1d:pct(1), chg_5d:pct(5), chg_20d:pct(20),
          ratio_ma20:c/mean(20), ratio_ma60:c/mean(60), volvol_20d:vv,
          range_pct:(high[i]-low[i])/c, pct_rank_252:cnt/252};
}
function predict(f){
  let z = MODEL.intercept; const contrib={};
  MODEL.features.forEach((k,j)=>{ const s=(f[k]-MODEL.mean[j])/MODEL.scale[j]; const v=s*MODEL.coef[j]; z+=v; contrib[k]=v; });
  return {p:1/(1+Math.exp(-z)), contrib};
}

/* ==========================================================
   PORTFOLIO MATH (look-through exposure & move attribution)
   ========================================================== */
const eur = (v,d=0)=> (v<0?'−':'')+'€'+Math.abs(v).toLocaleString('en-IE',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc = (v,d=1)=> (v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(d)+'%';
function total(){ return S.holdings.reduce((a,h)=>a+h.value,0); }
function exposure(){
  const T = total(); let beta=0,tech=0,usd=0,crypto=0; const co={}, direct={};
  S.holdings.forEach(h=>{ const w=h.value/T; beta+=w*h.beta; tech+=w*h.tech; usd+=w*h.usd; crypto+=w*(h.crypto||0);
    Object.entries(h.look||{}).forEach(([k,f])=>{ co[k]=(co[k]||0)+h.value*f; if(f===1) direct[k]=(direct[k]||0)+h.value; }); });
  let topId=null; Object.keys(co).forEach(k=>{ if(!topId||co[k]>co[topId]) topId=k; });
  const top = topId? {id:topId, name:COMPANY[topId], share:co[topId]/T, direct:direct[topId]||0, hidden:co[topId]-(direct[topId]||0)} : {id:null,name:'none',share:0,direct:0,hidden:0};
  return {T,beta,tech,usd,crypto,top,nvda:(co.nvda||0)/T,co};
}
/* For each holding: EUR return = local return + USD share × FX move.
   Market part = beta × market move; stock-specific = local − market part. */
function attribute(sc){
  const T = total(); let market=0, specific=0, fx=0; const per=[];
  S.holdings.forEach(h=>{
    const w=h.value/T, local=sc.local[h.id]??sc.market*h.beta;
    const m=h.beta*sc.market, s=local-m, f=h.usd*sc.fx;
    market+=w*m; specific+=w*s; fx+=w*f;
    per.push({h, ret:local+f, eurMove:h.value*(local+f), spec:s});
  });
  per.sort((a,b)=>a.eurMove-b.eurMove);
  return {market,specific,fx,total:market+specific+fx,eurTotal:T*(market+specific+fx),per,T};
}

/* Personal market-risk score 0-100 (explainable, rule-based) */
function riskScore(){
  const ex=exposure(); const clamp=(v)=>Math.max(0,Math.min(1,v));
  const parts=[
    ['Sensitivity to the market', clamp((ex.beta-0.6)/1.2)*40, `moves ${ex.beta.toFixed(2)}× the market`],
    ['Concentration in one name', clamp(ex.top.share/0.4)*30, `${ex.top.name} is ${(ex.top.share*100).toFixed(0)}% of your money`],
    ['Currency exposure', clamp(ex.usd)*15, `${(ex.usd*100).toFixed(0)}% in US dollars`],
    ['Crypto', clamp(ex.crypto/0.2)*15, `${(ex.crypto*100).toFixed(0)}% in crypto`]
  ];
  const score=Math.round(parts.reduce((a,p)=>a+p[1],0));
  const level = score<35?'Low':score<60?'Medium':'High';
  const tips=[];
  if(ex.top.share>S.concLimit) tips.push(`${ex.top.name} is above your ${(S.concLimit*100).toFixed(0)}% limit${ex.top.hidden>1?`, partly hidden inside your ETFs (${eur(ex.top.hidden)})`:''}. Consider a concentration rule.`);
  if(ex.beta>1.15) tips.push('Your portfolio swings more than the market. Expect bigger drops in a sell-off; a Calm-shield rule can help.');
  if(ex.usd>0.6) tips.push('Most of your money is in US dollars, so a weaker dollar can lower your euro value even if prices don’t move.');
  if(ex.crypto>0.1) tips.push('Crypto can halve in weeks. Keep it to an amount you could watch fall without selling.');
  if(S.profile.horizon==='<2' && score>=35) tips.push('You need this money within 2 years. For short horizons, lower-risk assets usually fit better.');
  if(!tips.length) tips.push('Well spread and in line with your plan. Vymera will stay quiet unless something really matters.');
  return {score, level, parts, tips, ex};
}

/* ==========================================================
   DECISION LOGIC (what Vymera recommends)
   ========================================================== */
function recommend(att){
  const ex = exposure(), w = S.weather?band(S.weather.p):'calm';
  const long = S.profile.horizon==='5+', short = S.profile.horizon==='<2';
  let rec='hold', why='';
  if(short && w==='stormy'){ rec='reduce'; why='You need this money within 2 years and a storm is likely, so lowering risk protects what you need soon.'; }
  else if(ex.top.share > S.concLimit && att.specific < -0.01){ rec='rebalance'; why=`Most of the extra loss came from one company that is ${(ex.top.share*100).toFixed(0)}% of your money, above your own ${(S.concLimit*100).toFixed(0)}% limit.`; }
  else { rec='hold'; why = long ? 'You invest for 5+ years. Drops like this are normal along the way, and selling now would lock in the loss.' : 'This move is within normal market swings. Your plan still works.'; }
  return {rec, why};
}

        <div class="row small" style="margin-top:8px"><b style="color:var(--green)">✓</b> Plain language, no jargon</div>
      </div>
    </div>
    <button class="btn primary" data-ob="next">Get started</button>
    <p class="xs muted" style="text-align:center;margin-top:10px">Takes 60 seconds · No personal financial details needed</p>
  </div>`;
  if(st===1) return `<div class="ob">${steps}
    <div class="eyebrow">Step 1 of 3 · Your plan</div>
    <h1 style="margin-top:6px">When will you need this money?</h1>

    ${[['<2','In less than 2 years','e.g. a deposit, a trip, studies'],['2-5','In 2–5 years','e.g. a car, moving out'],['5+','In 5+ years','long-term wealth building']].map(([k,t,s])=>`<button class="choice ${S.profile.horizon===k?'on':''}" data-h="${k}">${t}<span>${s}</span></button>`).join('')}
    <div class="grow"></div>
    <button class="btn primary" data-ob="next" ${S.profile.horizon?'':'disabled'}>Continue</button>
  </div>`;
  if(st===2) return `<div class="ob">${steps}
    <div class="eyebrow">Step 2 of 3 · Your reaction</div>
    <h1 style="margin-top:6px">Your portfolio drops 15% in a week. What’s your gut reaction?</h1>
    <p class="muted small" style="margin-top:6px">No wrong answer. It helps us time explanations for you.</p>
    ${[['sell','Sell before it gets worse','totally normal feeling'],['call','Call someone I trust','parent, friend, group chat'],['wait','Wait and check the news',''],['buy','Buy more while it’s cheap','']].map(([k,t,s])=>`<button class="choice ${S.profile.reaction===k?'on':''}" data-r="${k}">${t}${s?`<span>${s}</span>`:''}</button>`).join('')}
    <div class="grow"></div>
    <button class="btn primary" data-ob="next" ${S.profile.reaction?'':'disabled'}>Continue</button>
  </div>`;
  if(st===3) return `<div class="ob">${steps}
    <div class="eyebrow">Step 3 of 3 · Connect</div>
    <h1 style="margin-top:6px">Where do you invest?</h1>
    <p class="muted small" style="margin-top:6px">Read-only connection. Vymera can see holdings, never trade on its own.</p>
    ${[['tr','Trade Republic','#000'],['rev','Revolut','#0666EB'],['xtb','XTB','#E2231A'],['t212','Trading 212','#00A4DF']].map(([k,n,c])=>`<button class="broker ${S.profile.brokers.includes(k)?'on':''}" data-b="${k}"><div class="logo" style="background:${c}">${n.split(' ').map(x=>x[0]).join('')}</div><div><b style="color:var(--navy)">${n}</b><div class="xs muted">Read-only · EU regulated</div></div><div class="check">${S.profile.brokers.includes(k)?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4"><path d="M5 12l5 5 9-10"/></svg>':''}</div></button>`).join('')}
    <div class="grow"></div>
    <button class="btn green" data-ob="manual">Enter my own portfolio →</button>
    <button class="btn line" style="margin-top:8px" data-ob="finish">${S.profile.brokers.length?'Connect (demo portfolio)':'Use demo portfolio'}</button>
    <p class="xs muted" style="text-align:center;margin-top:10px">MVP: broker connections are simulated. Enter amounts to test with your own mix.</p>
  </div>`;
  if(st===4) return `<div class="ob">${steps}
    <div class="eyebrow">Your portfolio · rough amounts are fine</div>
    <h1 style="margin-top:6px">What do you hold?</h1>
    <p class="muted small" style="margin-top:6px">Enter rough amounts in euros. Nothing is stored or sent anywhere.</p>
    ${PortfolioForm()}
    <div class="grow" style="min-height:14px"></div>
    <button class="btn green" data-ob="custom" id="obCustom" ${draftTotal()>0?'':'disabled'}>See my risk assessment</button>
    <button class="btn line" style="margin-top:8px" data-ob="back">‹ Back</button>
  </div>`;
}
function draftTotal(){ return Object.values(S.draft).reduce((a,v)=>a+(+v||0),0); }
function PortfolioForm(){
  return `<div class="card flat" style="padding:6px 14px">${Object.entries(LIB).map(([id,L])=>`<div class="holding" style="padding:8px 0"><div class="logo" style="background:${L.color};width:34px;height:34px">${L.initials}</div><div style="flex:1"><b class="small" style="color:var(--navy)">${L.short}</b><div class="xs muted">${L.type}</div></div><div class="row" style="gap:4px"><span class="muted small">€</span><input type="number" inputmode="decimal" min="0" step="10" placeholder="0" value="${S.draft[id]??''}" data-amt="${id}" aria-label="${L.short} amount in euros" style="width:84px;padding:9px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;color:var(--navy);text-align:right"></div></div>`).join('')}</div>
  <div class="field"><label>My limit for one company</label><div class="chips">${[0.10,0.15,0.20,0.25].map(v=>`<button class="chip ${S.concLimit===v?'on':''}" data-lim="${v}">${Math.round(v*100)}%</button>`).join('')}</div></div>
  <div class="row between small" style="margin-top:12px"><span class="muted">Total</span><b id="draftTotal" style="color:var(--navy)">${eur(draftTotal())}</b></div>`;
}
function bindPortfolioForm(root, onChange){
  root.querySelectorAll('[data-amt]').forEach(inp=>inp.oninput=()=>{ const v=Math.max(0,+inp.value||0); S.draft[inp.dataset.amt]=inp.value===''?'':v; const t=root.querySelector('#draftTotal'); if(t) t.textContent=eur(draftTotal()); onChange&&onChange(); });
  root.querySelectorAll('[data-lim]').forEach(c=>c.onclick=()=>{ S.concLimit=+c.dataset.lim; root.querySelectorAll('[data-lim]').forEach(x=>x.classList.toggle('on',x===c)); });
}
function applyDraft(){
  const hs=Object.entries(S.draft).filter(([k,v])=>+v>0).map(([k,v])=>mk(k, Math.round(+v), 'Manual entry'));
  if(!hs.length) return false;
  S.holdings=hs; S.base=JSON.parse(JSON.stringify(hs)); S.custom=true; S.alerts=[]; S.unread=0; S.dayMove=0; return true;
}
function bindOnboarding(){
  view.querySelectorAll('[data-ob]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ob;
    if(k==='next'){ S.obStep++; render(); }
    else if(k==='manual'){ S.obStep=4; render(); }
    else if(k==='back'){ S.obStep=3; render(); }
    else if(k==='custom'){ if(applyDraft()){ S.onboarded=true; S.tab='home'; computeWeather(); render(); setTimeout(()=>act('snapshot',{}),250); } }
    else { S.onboarded=true; S.tab='home'; computeWeather(); render(); }
  });
  bindPortfolioForm(view, ()=>{ const b=$('#obCustom'); if(b) b.disabled = draftTotal()<=0; });
  view.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.profile.horizon=b.dataset.h; render();});
  view.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.profile.reaction=b.dataset.r; render();});
  view.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=b.dataset.b,a=S.profile.brokers; a.includes(k)?a.splice(a.indexOf(k),1):a.push(k); render();});
}

/* ---------- home ---------- */

  if(b==='calm') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="#4E9300" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  if(b==='choppy') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="#A8620B" stroke-width="2" stroke-linecap="round"><path d="M2 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="#1E2263" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 16a5 5 0 0 0-1-9.9A6 6 0 0 0 4.3 9 4 4 0 0 0 6 16"/><path d="M13 12l-3 5h4l-3 5"/></svg>`;
}
function sparkline(arr){
  const a = arr.slice(-60), mn=Math.min(...a,12), mx=Math.max(...a,30), W=300, H=46;
  const pts = a.map((v,i)=>`${(i/(a.length-1))*W},${H-((v-mn)/(mx-mn))*H}`).join(' ');
  const y25 = H-((25-mn)/(mx-mn))*H;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${y25}" y2="${y25}" stroke="#E4572E" stroke-dasharray="4 4" stroke-width="1"/><polyline points="${pts}" fill="none" stroke="#1E2263" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

  <div class="hero">
    <div class="eyebrow" style="color:rgba(255,255,255,.7)">All brokers · look-through</div>

  ${(()=>{ const r=riskScore(); const col=r.level==='Low'?'green':r.level==='Medium'?'amber':'coral'; return `<button class="card" data-act="snapshot" style="display:block;width:100%;text-align:left">

    <div class="bar" style="margin-top:10px;height:8px"><i style="width:${r.score}%;background:${r.level==='Low'?'var(--green)':r.level==='Medium'?'var(--amber)':'var(--coral)'}"></i></div>
    <div class="small" style="margin-top:8px;color:var(--ink)">${r.tips[0]}</div><div class="small link" style="margin-top:6px">See full breakdown ›</div></button>`; })()}

  <div class="card">

      <div><b style="color:var(--navy);font-size:1.05em">${w.p<0.01?'<1':(w.p*100).toFixed(0)}% storm chance</b><div class="small muted" style="margin-top:2px">${B.text}</div></div>
    </div>

    ${sparkline(S.vix.close)}
    <div class="row between xs muted"><span>VIX, last 60 days · ${S.vix.dates.at(-1)}</span><span style="color:var(--coral)">storm level 25</span></div>
    <details style="margin-top:10px"><summary class="small link" style="cursor:pointer">Why this forecast?</summary>
      <div class="small" style="margin-top:8px;line-height:1.5">Our model learned from 35 years of market data (1990–2015, tested on 2019–2026). Today the biggest drivers are:
      <ul style="margin:6px 0 0 18px">${top.map(([k,v])=>`<li>${FEAT_NAMES[k]}: ${v>0?'raises':'lowers'} the chance</li>`).join('')}</ul>

    <div class="divider"></div>
    ${S.holdings.map(h=>`<div class="holding"><div class="logo" style="background:${h.color}">${h.initials}</div><div style="flex:1"><b style="color:var(--navy)" class="small">${h.short}</b><div class="xs muted">${h.type} · ${h.broker}</div></div><b class="small">${eur(h.value)}</b></div>`).join('')}
  </div>

function Alerts(){
  if(S.sub && S.sub.type==='alert') return AlertDetail(S.alerts.find(a=>a.id===S.sub.id));
  return `<h1 style="margin-top:8px">Alerts</h1>
  <p class="muted small" style="margin-top:6px">Only when something moves <i>your</i> money. Each one tells you why and what you can do.</p>
  ${S.alerts.length? S.alerts.map(a=>`<button class="alert-item ${a.read?'read':''}" data-act="openAlert" data-id="${a.id}"><div class="dot"></div><div style="flex:1"><div class="row between"><b style="color:var(--navy)">${a.title}</b><span class="xs muted">${a.time}</span></div><div class="small muted" style="margin-top:2px">${a.sub}</div>${a.choice?`<span class="pill green" style="margin-top:8px">You chose: ${a.choice}</span>`:''}</div></button>`).join('')
  : `<div class="card flat" style="text-align:center;padding:30px 20px"><div style="font-size:34px">☀️</div><h3 style="margin-top:8px">Nothing to worry about</h3><p class="small muted" style="margin-top:6px">Try a scenario from the demo panel to see an explained alert.</p></div>`}
  ${S.history.length?`<h2 style="margin-top:24px">Decisions log</h2>${S.history.map(h=>`<div class="card flat small"><div class="row between"><b style="color:var(--navy)">${h.what}</b><span class="xs muted">${h.time}</span></div><div class="muted xs" style="margin-top:3px">${h.note}</div>${h.undo?`<button class="link xs" style="margin-top:6px" data-act="undo" data-id="${h.id}">Undo (24h)</button>`:''}</div>`).join('')}`:''}`;
}
function AlertDetail(a){
  a.read=true; S.unread=S.alerts.filter(x=>!x.read).length;
  const att=a.att, R=a.rec, plain=S.detail==='plain';
  const rows=[['Whole market',att.market],['Stock-specific extra',att.specific],['Currency (USD→EUR)',att.fx]];
  const maxAbs=Math.max(...rows.map(r=>Math.abs(r[1])),0.001);
  const worst=att.per[0];
  const opts = {
    hold:{t:'Hold', d:`Keep everything as it is. Your savings plan continues.`, cost:'Cost: €0'},
    rebalance:{t:'Rebalance', d:`Trim ${a.topName} back to your ${(S.concLimit*100).toFixed(0)}% limit: sell about ${eur(a.trim)} and spread it across your ETFs.`, cost:'Est. fee €1 · may trigger tax on gains'},
    reduce:{t:'Reduce risk', d:`Move 10% (${eur(att.T*0.1)}) into a money market ETF that barely moves.`, cost:'Est. fee €1 · may trigger tax on gains'}
  };
  return `<button class="back" data-act="backAlerts">‹ Alerts</button>
  <div class="eyebrow">${a.time} · ${a.kind}</div>
  <h1 style="margin-top:4px;font-size:1.55em">${a.headline}</h1>

  <div class="card">
    <h3>What moved your money</h3>
    <div class="wf">${rows.map(([n,v])=>`<div class="wf-row"><span>${n}</span><div class="wf-track"><i class="${v>0?'pos':''}" style="width:${Math.abs(v)/maxAbs*50}%"></i></div><b>${pc(v)}</b></div>`).join('')}
      <div class="divider"></div><div class="wf-row"><b style="text-align:left">Your portfolio</b><span></span><b>${pc(att.total)}</b></div></div>
    <div class="quote">${a.explain}</div>
    ${plain?'':`<div class="code">${att.per.map(p=>`${p.h.short.padEnd(14,' ')} ${pc(p.ret).padStart(7,' ')}  ${eur(p.eurMove,0).padStart(6,' ')}`).join('<br>').replace(/ /g,'&nbsp;')}</div>`}
  </div>

  <div class="card">
    <div class="row between"><h3>Your options</h3><span class="xs muted">You decide</span></div>
    ${['hold','rebalance','reduce'].map(k=>`<button class="option ${R.rec===k?'rec':''} ${a.choice===opts[k].t?'sel':''}" data-act="choose" data-k="${k}" data-id="${a.id}">
      <div class="t">${opts[k].t}${R.rec===k?'<span class="pill green">Fits your plan</span>':''}</div>
      <div class="small" style="margin-top:4px;color:var(--ink)">${opts[k].d}</div>
      ${R.rec===k?`<div class="small" style="margin-top:6px;color:var(--green-d)"><b>Why:</b> ${R.why}</div>`:''}
      <div class="xs muted" style="margin-top:6px">${opts[k].cost}</div></button>`).join('')}
    <div class="sources"><b>Sources:</b> ${a.sources}<br>Vymera gives information, not personal investment advice. Nothing is traded without your confirmation.</div>
  </div>

  <div class="card flat">
    <div class="row"><div class="lesson" style="box-shadow:none;padding:0;margin:0;width:auto"><div class="em">💬</div></div><div class="small"><b style="color:var(--navy)">Talk it through</b><div class="muted">Send this explanation to someone you trust: a parent, a friend, your group chat.</div></div></div>
    <button class="btn ghost" style="margin-top:10px" data-act="share">Share explanation</button>
  </div>
  <div class="card flat"><div class="small"><b style="color:var(--navy)">Learn in 60 seconds:</b> <button class="link" data-act="lesson" data-l="${a.lesson}">${LESSONS.find(l=>l.id===a.lesson).t}</button></div></div>`;
}

/* ---------- rules ---------- */
function Rules(){

function RuleBuilder(){

function Backtest(){
  const runs = ['covid_2020','tariff_2025'].map(k=>{
    const d=VIX[k]; const trig=[]; let inStorm=false;
    for(let i=0;i<d.dates.length;i++){            // FOR each historical day
      const p=d.p_python[i]; if(p===null) continue;
      if(p>=0.6 && !inStorm){ trig.push({date:d.dates[i], vix:d.close[i], p}); inStorm=true; }   // IF storm starts → proposal
      if(p<0.3) inStorm=false;
    }
    return {k, trig, d};
  });
  const info = {covid_2020:{t:'COVID-19 crash, 2020', low:'2020-03-23', from:'2020-01-02'}, tariff_2025:{t:'Tariff shock, 2025', low:'2025-04-08', from:'2025-01-02'}};
  const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
  return `<button class="back" data-act="backRules">‹ Rules</button>
  <h1>Calm shield: backtest</h1><p class="small muted" style="margin-top:6px">How often would this rule have asked you, using real VIX data and the same model?</p>
  ${runs.map(r=>{const I=info[r.k]; const tr=r.trig.filter(t=>t.date>=I.from); const first=tr[0];
    return `<div class="card"><h3>${I.t}</h3>${miniChart(r.d, I.from)}
    <div class="small" style="margin-top:8px"><b style="color:var(--navy)">${tr.length} proposal${tr.length===1?'':'s'}</b> in the first half of the year.${first?` First one on <b>${first.date}</b> (VIX ${first.vix.toFixed(1)}), <b>${days(first.date,I.low)} days before</b> the market low on ${I.low}.`:''}</div></div>`}).join('')}
  <p class="xs muted" style="margin-top:12px">Backtests show the past, not the future. The model misses some storms and raises some false alarms (about 1 in 20 calm days).</p>`;
}
function miniChart(d, from){
  const i0=d.dates.findIndex(x=>x>=from); const c=d.close.slice(i0), p=d.p_python.slice(i0); const W=300,H=70, mx=Math.max(...c,30);
  const pl=c.map((v,i)=>`${i/(c.length-1)*W},${H-v/mx*H}`).join(' ');
  const area='0,'+H+' '+p.map((v,i)=>`${i/(p.length-1)*W},${H-(v||0)*H}`).join(' ')+` ${W},${H}`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;margin-top:8px" preserveAspectRatio="none"><polygon points="${area}" fill="#6CC201" opacity=".25"/><line x1="0" x2="${W}" y1="${H-25/mx*H}" y2="${H-25/mx*H}" stroke="#E4572E" stroke-dasharray="4 4"/><polyline points="${pl}" fill="none" stroke="#1E2263" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg><div class="row xs muted" style="gap:12px"><span><b style="color:#1E2263">—</b> VIX</span><span><b style="color:#6CC201">■</b> storm probability</span></div>`;
}

function replayTariff(){
  const d=VIX.tariff_2025; let i=d.dates.indexOf('2025-02-14'); const end=d.dates.indexOf('2025-04-10');
  S.vix={close:d.close.slice(0,i), high:d.high.slice(0,i), low:d.low.slice(0,i), dates:d.dates.slice(0,i)};
  computeWeather(); S.tab='home'; S.sub=null; render();
  toast('Replaying real VIX data: Feb–Apr 2025','▶');
  let fired=false;
  replayTimer=setInterval(()=>{            // WHILE the replay runs: one trading day per tick
    if(i>end){ clearInterval(replayTimer); return; }
    S.vix.close.push(d.close[i]); S.vix.high.push(d.high[i]); S.vix.low.push(d.low[i]); S.vix.dates.push(d.dates[i]);
    const today=i; i++;
    computeWeather();
    if(S.tab==='home' && !S.sub){ const knob=$('.knob'); if(knob){ render(); } }
    const rule=S.rules.find(r=>r.when==='stormy');
    if(!fired && rule.on && !S.paused && band(S.weather.p)==='stormy'){   // IF rule condition met → propose
      fired=true; clearInterval(replayTimer);
      const ex=exposure();
      const p={id:'p'+Date.now(), rule:rule.name, status:'pending', date:d.dates[today], vix:d.close[today], prob:S.weather.p,
        amount:Math.round(ex.T*0.10), summary:`Market weather turned Stormy (${(S.weather.p*100).toFixed(0)}%). Proposal: move ${eur(Math.round(ex.T*0.10))} into a money market ETF.`};
      S.proposals.unshift(p);
      render();
      toast(`“${rule.name}” triggered on ${d.dates[today]}. Tap to review.`,'🛡', ()=>openProposal(p.id));
    }
  }, 140);
}
function openProposal(id){
  const p=S.proposals.find(x=>x.id===id); const ex=exposure();
  sheet(`<div class="eyebrow">Rule triggered · ${p.date}</div><h2 style="margin-top:4px">${p.rule}: your OK needed</h2>
    <div class="quote"><b>Why now:</b> the fear index (VIX) jumped to ${p.vix.toFixed(1)} and our model gives a ${(p.prob*100).toFixed(0)}% chance of a stormy two weeks. Your portfolio moves ${ex.beta.toFixed(2)}× the market, so a 10% market drop could mean about ${eur(ex.T*0.1*ex.beta)} for you.</div>
    <div class="card flat"><div class="small"><b style="color:var(--navy)">You set this rule on a calm day:</b><div class="code" style="margin-top:6px">IF market weather is Stormy<br>THEN propose moving 10% into a money market ETF</div></div>
    <div class="divider"></div><div class="row between small"><span class="muted">Move</span><b>${eur(p.amount)} → money market ETF</b></div><div class="row between small" style="margin-top:6px"><span class="muted">Fee / tax</span><b>~€1 · possible tax on gains</b></div><div class="row between small" style="margin-top:6px"><span class="muted">Expires</span><b>in 24h if you do nothing</b></div></div>
    <button class="btn green" style="margin-top:12px" id="pOk">Confirm with one tap</button>
    <div class="row" style="gap:8px;margin-top:8px"><button class="btn line" id="pNo">Not now</button><button class="btn line" id="pPause">Pause rule</button></div>
    <p class="xs muted" style="margin-top:10px;text-align:center">${S.trialMode?'Trial mode: simulated, no real trade.':'Undo possible for 24h.'}</p>`, (root)=>{
      $('#pOk',root).onclick=()=>{ p.status='done'; closeSheet(); log('Calm shield confirmed', `${eur(p.amount)} → money market ETF${S.trialMode?' (trial)':''}`, true); toast('Done. 10% is now in a calm place. Undo within 24h.','✓'); render(); };
      $('#pNo',root).onclick=()=>{ p.status='declined'; closeSheet(); log('Proposal declined','You chose to hold. Rule stays on.',false); render(); };
      $('#pPause',root).onclick=()=>{ p.status='declined'; S.rules.find(r=>r.when==='stormy').on=false; closeSheet(); toast('Calm shield paused.','⏸'); render(); };
    });
}
function hype(){
  S.tab='home'; S.sub=null; render();
  const ex=exposure(), buy=200, after=(ex.nvda*ex.T+buy)/(ex.T+buy);
  sheet(`<div class="row" style="gap:10px"><div class="logo" style="background:#000">TR</div><div><div class="eyebrow">Trade Republic · buy order</div><b style="color:var(--navy)">Buy ${eur(buy)} of Nvidia</b></div></div>
    <div class="card" style="background:var(--amber-l);box-shadow:none"><b style="color:#A8620B">Vymera cool-off · your rule “Hype cool-off”</b>
    <p class="small" style="margin-top:6px;line-height:1.5">Nvidia is trending on TikTok this week. Before you buy:</p>
    <ul class="small" style="margin:6px 0 0 18px;line-height:1.6"><li>It’s already <b>${(ex.nvda*100).toFixed(0)}%</b> of your money. After this: <b>${(after*100).toFixed(0)}%</b> (your limit: ${(S.concLimit*100).toFixed(0)}%).</li><li>Stocks bought on hype in our interviews were sold at −18% and −€150.</li><li>Your MSCI World ETF already owns Nvidia.</li></ul></div>
    <div class="countdown" id="cd">10</div><p class="xs muted" style="text-align:center;margin-top:-6px">Take ten seconds. You can still buy if you want.</p>
    <button class="btn green" style="margin-top:12px" id="hWait">Remind me in 24h</button>
    <div class="row" style="gap:8px;margin-top:8px"><button class="btn line" id="hSmall">Buy €50 instead</button><button class="btn line" id="hBuy" disabled>Buy anyway</button></div>`, (root)=>{
      let s=10; const cd=$('#cd',root);
      const t=setInterval(()=>{ s--; if(cd) cd.textContent=s; if(s<=0){ clearInterval(t); cd.textContent='✓'; $('#hBuy',root).disabled=false; } },1000);   // WHILE timer > 0, "Buy anyway" stays disabled
      $('#hWait',root).onclick=()=>{clearInterval(t); closeSheet(); log('Hype buy postponed','Reminder set for tomorrow · €200 Nvidia',false); toast('We’ll remind you tomorrow. Most hype fades in a day.','⏳');};
      $('#hSmall',root).onclick=()=>{clearInterval(t); closeSheet(); log('Smaller buy','€50 Nvidia instead of €200',false); toast('Smaller buy sent to Trade Republic (demo).','✓');};
      $('#hBuy',root).onclick=()=>{clearInterval(t); closeSheet(); log('Bought anyway','€200 Nvidia · your call',false); toast('Order sent (demo). We added it to your log.','✓');};
    });
}

/* ==========================================================
   UI helpers
   ========================================================== */
function sheet(html, bind){ const o=$('#overlay'); o.innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
  $('#sbg').onclick=(e)=>{ if(e.target.id==='sbg') closeSheet(); };
  o.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  bind&&bind(o); }
function closeSheet(){ $('#overlay').innerHTML=''; }
let toastT=null;
function toast(msg, ic='V', onClick){ const s=$('#screen'); s.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<div class="ic">${ic}</div><div class="small"><b>Vymera</b><div style="opacity:.85">${msg}</div></div>`; s.appendChild(t);
  t.onclick=()=>{t.remove(); onClick&&onClick();}; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 4200); }
function updateModelInfo(){
  if(!S.weather) return;
  const f=featuresAt(S.vix.close,S.vix.high,S.vix.low,S.vix.close.length-1);
  $('#modelInfo').innerHTML=`date&nbsp;&nbsp;&nbsp;&nbsp;${S.vix.dates.at(-1)}<br>VIX&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${f.vix.toFixed(2)}<br>vs MA20&nbsp;${f.ratio_ma20.toFixed(2)}<br>5d chg&nbsp;&nbsp;${pc(f.chg_5d)}<br>p(storm) <b>${(S.weather.p*100).toFixed(1)}%</b> → <b>${BAND[band(S.weather.p)].label}</b><br><span style="opacity:.6">logistic regression · 10 features<br>test AUC ${MODEL.test_auc} (2019–2026)</span>`;
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab; S.sub=null; render();});
document.querySelectorAll('.scn').forEach(b=>b.onclick=()=>{ scenario(b.dataset.scn); $('#panel').classList.remove('open'); });
$('#panelToggle').onclick=()=>$('#panel').classList.toggle('open');
computeWeather(); render(); updateModelInfo();
</script>
